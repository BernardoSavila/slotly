services:
  postgres:
    image: postgres:17-alpine
    container_name: slotly-db
    environment:
      POSTGRES_DB: slotly
      POSTGRES_USER: slotly
      POSTGRES_PASSWORD: slotly
    ports:
      - "5432:5432"
    volumes:
      - slotly-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slotly -d slotly"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  slotly-data: