spring:
  application:
    name: slotly

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/slotly}
    username: ${DATABASE_USERNAME:slotly}
    password: ${DATABASE_PASSWORD:slotly}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    locations: classpath:db/migration

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

logging:
  level:
    org.hibernate.SQL: debug

slotly:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-at-least-32-bytes-long-change-me}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
