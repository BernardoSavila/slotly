spring:
  application:
    name: slotly

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/slotly}
    username: ${DATABASE_USERNAME:slotly}
    password: ${DATABASE_PASSWORD:slotly}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug